<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Giriş Yap</title>
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="container">
      <div class="form-container">
        <div class="logo">
          <img
            src="../svg/undraw_easter-bunny_1v4n.svg"
            alt="logo"
            width="70px"
          />
        </div>
        <h2>Hoş geldin!</h2>
        <p>Lütfen giriş yapmak için bilgilerini gir!</p>
        <form>
          <label for="email">E-posta</label>
          <input
            type="email"
            id="email"
            placeholder="admin@ornek.com"
            required
          />

          <label for="password">Şifre</label>
          <div class="password-container">
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              required
            />
            <span class="toggle-password" onclick="togglePassword()">👁️</span>
          </div>

          <button type="submit" id="login-btn">Giriş Yap</button>
          <p class="signUp">
            Henüz bir hesabın yok mu?
            <a href="../Register/index.html">Kayıt ol</a>
          </p>
        </form>
      </div>
      <div class="image-container">
        <img src="../image/Tavşan.jpeg" alt="Giriş Görseli" />
      </div>
    </div>

    <!-- Snackbar mesajı -->
    <div id="snackbar"></div>
  </body>
</html>
