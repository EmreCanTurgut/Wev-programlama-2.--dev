<!DOCTYPE html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Ders Yönetimi</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="dersY.css" />
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"
            defer
        ></script>
    </head>
    <body>
        <!-- Üst Bar -->
        <div class="container-fluid bg-light py-2 border-bottom">
            <div class="d-flex justify-content-end align-items-center px-4">
                <span id="usernameDisplay" class="me-3 fw-semibold user"
                    >User</span
                >
                <button
                    class="btn btn-outline-danger btn-sm"
                    onclick="logout()"
                >
                    Çıkış
                </button>
            </div>
        </div>

        <div class="container mt-5">
            <h2 class="text-center mb-4">Ders Yönetimi</h2>
            <a href="../index.html" class="btn btn-outline-secondary mb-3">
                <i class="bi bi-arrow-left"></i> Geri
            </a>

            <!-- Yeni Ders Formu -->
            <div class="card mb-4">
                <div class="card-header">Yeni Ders Ekle</div>
                <div class="card-body">
                    <form id="lessonForm">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    name="ad"
                                    placeholder="Ders Adı"
                                    required
                                />
                            </div>
                            <div class="col-md-2">
                                <input
                                    type="text"
                                    class="form-control"
                                    name="kod"
                                    placeholder="Ders Kodu"
                                    required
                                />
                            </div>
                            <div class="col-md-1">
                                <input
                                    type="number"
                                    class="form-control"
                                    name="kredi"
                                    placeholder="Kredi"
                                    required
                                />
                            </div>
                            <div class="col-md-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    name="ogretimUyesi"
                                    placeholder="Öğretim Üyesi"
                                    required
                                />
                            </div>
                            <!-- Yeni Alan: Çıktı Kodları -->
                            <div class="col-md-3">
                                <input
                                    type="text"
                                    class="form-control"
                                    name="outcomes"
                                    placeholder="Çıktı Kodları (örn: 1,2,3)"
                                />
                            </div>
                        </div>
                        <div class="text-end mt-3">
                            <button type="submit" class="btn btn-primary">
                                Ders Ekle
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Ders Listesi -->
            <div class="card">
                <div
                    class="card-header d-flex justify-content-between align-items-center"
                >
                    <span>Ders Listesi</span>
                    <input
                        type="text"
                        id="searchInput"
                        class="form-control w-50"
                        placeholder="Ders ara..."
                    />
                </div>
                <div class="card-body table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-light">
                            <tr>
                                <th>Ad</th>
                                <th>Kodu</th>
                                <th>Kredi</th>
                                <th>Öğretim Üyesi</th>
                                <th>İşlem</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Snackbar -->
        <div id="snackbar"></div>

        <script src="dersY.js"></script>
    </body>
</html>
